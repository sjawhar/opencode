name: test

on:
  push:
    branches:
      - dev
      - sami
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run unit tests
        timeout-minutes: 28
        run: |
          set -uo pipefail

          if [ "$RUNNER_OS" != "Linux" ]; then
            GITHUB_ACTIONS=false bun turbo test
            exit $?
          fi
          # bun on GitHub-hosted Linux runners has intermittently failed to exit after
          # the suite completes (exit-spin). Run the suite detached with streamed task
          # logs so every result reaches the log even mid-spin, wait for a normal exit,
          # and only after a long quiet period or the deadline reap OUR OWN process
          # group and decide the result from the streamed log.
          #
          # Never sweep-kill workspace processes by name: a previous version of this
          # step killed every bun/turbo/node process with a workspace cwd, which
          # repeatedly took down the runner itself ("The runner has received a shutdown
          # signal") and, worse, killed still-running suites ~60s in and then declared
          # success from the partial log. Orphans that escape our process group are
          # reaped by the runner's own cleanup at job end.
          LOG="${RUNNER_TEMP:-/tmp}/unit-test.log"
          : > "$LOG"

          setsid bash -c 'exec </dev/null; GITHUB_ACTIONS=false bun turbo test --log-order=stream --continue' > "$LOG" 2>&1 &
          PID=$!
          PGID="$(ps -o pgid= -p "$PID" | tr -d ' ' || true)"

          # Stream the log into the job output live so results survive any failure mode.
          tail -n +1 -F "$LOG" 2>/dev/null &
          TAILPID=$!

          stable=0
          last=-1
          mode=deadline
          deadline=$((SECONDS + 24 * 60))

          while kill -0 "$PID" 2>/dev/null; do
            sz="$(wc -c < "$LOG" 2>/dev/null || echo 0)"
            if [ "$sz" -eq "$last" ]; then
              stable=$((stable + 1))
            else
              stable=0
              last="$sz"
            fi
            # 10 minutes of total output silence means the run is hung or spinning.
            # The verification below still decides the result honestly: a suite that
            # was killed mid-run has no turbo completion summary and fails the step.
            if [ "$stable" -ge 120 ]; then
              mode=quiet
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              mode=deadline
              break
            fi
            sleep 5
          done

          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID"
            rc=$?
            kill "$TAILPID" 2>/dev/null || true
            echo "unit suite process exited on its own (rc=$rc)"
            exit "$rc"
          fi

          echo "::warning::unit suite did not exit (mode=$mode); reaping our process group and verifying results from the log."
          if [ -n "${PGID:-}" ]; then
            kill -TERM "-$PGID" 2>/dev/null || true
            sleep 2
            kill -KILL "-$PGID" 2>/dev/null || true
          fi
          kill "$TAILPID" 2>/dev/null || true

          if ! grep -qE 'Ran [0-9]+ tests' "$LOG"; then
            echo "::error::no test output found; unit suite may not have run"
            exit 1
          fi
          if grep -qE '\(fail\) |[1-9][0-9]* fail|finished with error|run failed|Command failed|ELIFECYCLE' "$LOG"; then
            echo "::error::unit suite reported test failures"
            exit 1
          fi
          if ! grep -qE 'Tasks:[[:space:]]+[0-9]+ successful' "$LOG"; then
            echo "::error::suite never reached turbo completion; treating as failure"
            exit 1
          fi
          echo "unit suite completed with no failures despite the exit-spin"
          exit 0
        env:
          # Native @parcel/watcher (inotify on Linux) keeps a live OS handle/thread that blocks bun
          # from exiting after the suite completes -> the exit-spin/hang that fails unit (linux). Unit
          # tests never need a live watcher (watcher.test.ts is CI-skipped and sets its own flag), so
          # disable it on all platforms -- Windows already did this; Linux never got the same fix.
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"

      - name: Check generated client
        if: runner.os == 'Linux'
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        if: runner.os == 'Linux'
        working-directory: packages/opencode
        run: bun run test:httpapi

  e2e:
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report

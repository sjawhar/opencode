[tools]
# Pin bun to match package.json's `packageManager` field, which is what
# CI uses via setup-bun's `bun-version-file: package.json`. Without this
# override, mise resolves bun via global config, which on developer
# machines may diverge from CI and produce different `bun install`
# layouts (e.g. isolated-linker bucket contents).
bun = "1.3.13"
